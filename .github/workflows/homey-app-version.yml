name: Update Homey App Version
on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        type: string
        description: Changelog
        required: true

# main is protected (a review plus the "Validate Homey App" check), so the bump goes up as a PR
# instead of a direct push. The tag and GitHub release are created by homey-app-release.yml once
# the PR is merged.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  main:
    name: Update Homey App Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Homey App Version
        uses: athombv/github-action-homey-app-version@master
        id: update_app_version
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Open release PR
        run: |
          branch="release/v$VERSION"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add -A
          git commit -m "Update Homey App Version to v$VERSION"
          git push origin "$branch"

          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Update Homey App Version to v$VERSION" --body "$CHANGELOG"

          # Pushes and PRs made with GITHUB_TOKEN don't trigger other workflows, so the required
          # "Validate Homey App" check would never run on this PR. A dispatch is the exception.
          gh workflow run homey-app-validate.yml --ref "$branch"
        env:
          VERSION: ${{ steps.update_app_version.outputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
          GH_TOKEN: ${{ github.token }}
